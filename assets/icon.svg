<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="inkscape-mcp">
  <title>inkscape-mcp</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Bézier handle lines: thin, low-contrast (read as construction geometry) -->
  <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="88" x2="32" y2="36"/>
    <line x1="96" y1="40" x2="96" y2="92"/>
  </g>

  <!-- Control-point dots -->
  <g fill="#94a3b8">
    <circle cx="32" cy="36" r="3"/>
    <circle cx="96" cy="92" r="3"/>
  </g>

  <!-- The path itself: the bold gradient stroke is the focal element -->
  <path d="M 32 88 C 32 36, 96 92, 96 40"
        fill="none"
        stroke="url(#curve)"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Selected end nodes (square handles, vector-editor style) -->
  <g fill="#0f172a" stroke="#a78bfa" stroke-width="3">
    <rect x="25" y="81" width="14" height="14" rx="2"/>
    <rect x="89" y="33" width="14" height="14" rx="2"/>
  </g>
</svg>
