name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.14 installs without pip inkex and runs extensions against Inkscape's bundled
        # copy (see pyproject.toml), so it exercises a different dependency set.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Inkscape 1.4.x + system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update
          # Inkscape installs WITH its recommends, matching what the README tells users
          # to run. Under --no-install-recommends the trace codepath segfaults, so CI
          # was both unrepresentative of a real install and unable to cover trace_image.
          sudo apt-get install -y inkscape
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev
          inkscape --version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync project
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Catches advertised-vs-implemented drift: mypy flagged the operation Literal
      # mismatch and the shadowed analysis branch before either was noticed by hand.
      - name: Mypy
        run: uv run mypy src/

      # tests/live/ drives a real Inkscape GUI over D-Bus — no display, no bridge, and
      # (as the multi-window work showed) 1.4.4 is not stable enough under automation to
      # be worth booting one in CI. Those tests skip themselves when no bridge is
      # reachable; ignoring the directory keeps them from even importing.
      - name: Pytest
        run: >
          uv run pytest tests/ -m "not network" -q --tb=short
          --ignore=tests/test_inkscape_live.py
          --ignore=tests/live

  # The headless suite on macOS: Inkscape.app bundle discovery, the MCP-owned profiles
  # and the Python 3.14 bundled-inkex path differ from Linux. The live tier needs a GUI
  # session and stays local, as on Linux.
  macos:
    name: Tests (macOS, Python 3.14)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The cask tracks the current Inkscape release; tests/conftest.py stops the run
      # if it is not 1.4.x.
      - name: Install Inkscape
        run: |
          brew install --cask inkscape
          /Applications/Inkscape.app/Contents/MacOS/inkscape --version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync project
        run: uv sync --all-extras --dev

      - name: Pytest
        run: >
          uv run pytest tests/ -m "not network" -q --tb=short
          --ignore=tests/test_inkscape_live.py
          --ignore=tests/live

      # Running extensions must never write into the app bundle (it breaks the seal).
      - name: Inkscape.app is unmodified
        run: |
          test -z "$(find /Applications/Inkscape.app -name __pycache__)"
          codesign --verify --deep --strict /Applications/Inkscape.app
