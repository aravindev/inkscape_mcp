name: Security

on:
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC — nightly was overkill
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps for pycairo / pygobject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository-2.0-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync project
        run: uv sync --all-extras

      - name: pip-audit (third-party deps only)
        run: |
          uv pip install pip-audit
          uv export --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --disable-pip --strict
